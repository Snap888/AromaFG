name: AromaFG CI
# Vulkan backend validation: keep ABI and planner tests enabled in Release builds

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev glslang-tools spirv-tools
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAROMA_FG_BUILD_TESTS=ON -DAROMA_FG_COMPILE_SHADERS=ON
      - name: Build library, tests and SPIR-V
        run: cmake --build build --parallel
      - name: Run contract tests
        run: ctest --test-dir build --output-on-failure
      - name: Upload SPIR-V artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aromafg-shaders
          path: build/shaders/*.spv
